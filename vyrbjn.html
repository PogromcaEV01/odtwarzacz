<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odtwarzacz z Siódmej Hali</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🎶</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

<style>
    /* --- BAZA I ROZJAŚNIENIE --- */
    * { box-sizing: border-box; cursor: none; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f0f0f0; border-left: 1px solid #ccc; }
    ::-webkit-scrollbar-thumb { background: #bbb; }
    ::-webkit-scrollbar-thumb:hover { background: #999; }

    body {
        font-family: 'Cinzel', cursive;
        font-size: 1.4em; 
        background: #fdfdfd; color: #333;
        max-width: 600px; margin: 0 auto; padding: 40px 20px; min-height: 100vh;
        display: flex; flex-direction: column; justify-content: center;
        animation: crt-flicker 10s infinite; position: relative; overflow-x: hidden;
    }

    /* Linia Skanowania CRT */
    body::before {
        content: ""; display: block; position: fixed; inset: 0;
        background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
        z-index: 999; background-size: 100% 4px; pointer-events: none; opacity: 0.5;
    }

    /* --- ANIMACJE --- */
    @keyframes crt-flicker {
        0% { opacity: 0.99; } 5% { opacity: 0.95; } 10% { opacity: 0.99; } 15% { opacity: 1; } 100% { opacity: 1; }
    }

    @keyframes eq-play {
        0% { height: 10%; background: #aaa; }
        100% { height: 100%; background: #555; }
    }

    /* Glitch Text CSS */
    .glitch-txt {
        position: relative; display: inline-block; color: #333;
        text-shadow: 1px 1px 0px #eee; font-size: 1.8em; border-bottom: 2px dashed #ccc; padding-bottom: 10px; width: 100%; text-align: center;
    }
    .glitch-txt::before, .glitch-txt::after {
        content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent;
    }
    .glitch-txt::before { left: 2px; text-shadow: -1px 0 rgba(255,0,0,0.5); clip: rect(24px, 550px, 90px, 0); animation: glitch-anim-2 3s infinite linear alternate-reverse; z-index: -1; }
    .glitch-txt::after { left: -2px; text-shadow: -1px 0 rgba(0,0,255,0.5); clip: rect(85px, 550px, 140px, 0); animation: glitch-anim 2.5s infinite linear alternate-reverse; z-index: -2; }
    
    @keyframes glitch-anim { 0% { clip: rect(32px, 9999px, 28px, 0); transform: skew(0.1deg); } 20% { clip: rect(12px, 9999px, 83px, 0); transform: skew(0.1deg); } 40% { clip: rect(54px, 9999px, 2px, 0); transform: skew(0.1deg); } 60% { clip: rect(98px, 9999px, 44px, 0); transform: skew(0.1deg); } 100% { clip: rect(44px, 9999px, 12px, 0); transform: skew(0.1deg); } }
    @keyframes glitch-anim-2 { 0% { clip: rect(12px, 9999px, 93px, 0); transform: skew(0.1deg); } 20% { clip: rect(65px, 9999px, 32px, 0); transform: skew(0.1deg); } 40% { clip: rect(23px, 9999px, 55px, 0); transform: skew(0.1deg); } 60% { clip: rect(87px, 9999px, 12px, 0); transform: skew(0.1deg); } 100% { clip: rect(99px, 9999px, 4px, 0); transform: skew(0.1deg); } }

    /* --- UI ODTWARZACZA --- */
    .panel { 
        margin: 25px auto; padding: 30px; border: 1px solid #eee; background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); position: relative; transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
        transform-origin: center center; width: 100%; z-index: 2;
    }

    .track-info { text-align: center; margin: 20px 0; }
    .track-artist { color: #888; font-size: 0.8em; margin-bottom: 5px; }
    .track-title { font-weight: bold; font-size: 1.1em; color: #000; }

    /* Controls */
    .controls { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
    button {
        background: #fff; color: #333; border: 1px solid #ccc;
        padding: 5px 15px; font-family: 'Cinzel', cursive; font-size: 1.2em;
        transition: 0.2s; cursor: none; flex-grow: 1; font-weight: bold;
    }
    button:hover { background: #f5f5f5; border-color: #bbb; }
    button:active { background: #eee; transform: translateY(1px); }

    /* Progress bar */
    .progress-container { margin: 20px 0; display: flex; align-items: center; gap: 15px; font-size: 0.8em; color: #666; }
    input[type="range"] {
        -webkit-appearance: none; width: 100%; background: transparent; cursor: none;
    }
    input[type="range"]::-webkit-slider-runnable-track {
        width: 100%; height: 6px; background: #eee; border: 1px solid #ccc;
    }
    input[type="range"]::-webkit-slider-thumb {
        height: 16px; width: 10px; background: #333; cursor: none; -webkit-appearance: none; margin-top: -6px; border: 1px solid #000;
    }
    input[type="range"]:focus { outline: none; }

    /* Visualizer */
    .hud-visualizer {
        display: flex; gap: 4px; align-items: flex-end; height: 30px; justify-content: center; margin-top: 25px; opacity: 0.2; transition: opacity 0.3s;
    }
    .hud-visualizer.playing { opacity: 0.8; }
    .hud-bar { width: 8px; background: #aaa; height: 10%; }
    .hud-visualizer.playing .hud-bar { animation: eq-play 1s infinite alternate ease-in-out; }
    .hud-bar:nth-child(1) { animation-duration: 0.7s; } .hud-bar:nth-child(2) { animation-duration: 0.9s; }
    .hud-bar:nth-child(3) { animation-duration: 1.3s; } .hud-bar:nth-child(4) { animation-duration: 0.8s; }
    .hud-bar:nth-child(5) { animation-duration: 1.1s; } .hud-bar:nth-child(6) { animation-duration: 0.6s; }
    .hud-bar:nth-child(7) { animation-duration: 1.2s; }

    /* --- KURSOR I TŁO --- */
    #custom-cursor {
        position: fixed; top: 0; left: 0; width: 10px; height: 10px; border: 1px solid #333; background: rgba(0,0,0,0.1);
        border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); transition: width 0.1s, height 0.1s;
    }
    .cursor-trail {
        position: fixed; top: 0; left: 0; width: 5px; height: 5px; background: rgba(0,0,0,0.05);
        border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
    }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; opacity: 0.1; }

</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="custom-cursor"></div>

<div class="panel">
    <h2 class="glitch-txt" data-text="> ODTWARZACZ_SYS_">> ODTWARZACZ_SYS_</h2>
    
    <div class="track-info">
        <div class="track-artist">> SYSTEM_INIT</div>
        <div class="track-title" id="track-name">Inicjalizacja...</div>
    </div>

    <div class="progress-container">
        <span id="time-current">0:00</span>
        <input type="range" id="seek-bar" value="0" min="0" max="100" style="pointer-events: none;">
        <span id="time-total">0:00</span>
    </div>

    <div class="controls">
        <button id="btn-prev" title="Poprzedni">[ &lt;&lt; ]</button>
        <button id="btn-play" title="Odtwarzaj / Pauzuj" style="flex-grow: 2;">[ PLAY ]</button>
        <button id="btn-next" title="Następny">[ &gt;&gt; ]</button>
    </div>
    
    <div class="progress-container" style="margin-top: 15px; margin-bottom: 0;">
        <span style="font-size: 0.8em;">VOL:</span>
        <input type="range" id="volume-bar" value="100" min="0" max="100">
    </div>

    <div class="hud-visualizer" id="visualizer">
        <div class="hud-bar"></div><div class="hud-bar"></div><div class="hud-bar"></div>
        <div class="hud-bar"></div><div class="hud-bar"></div><div class="hud-bar"></div>
        <div class="hud-bar"></div>
    </div>
    
    <audio id="audio-player" style="display:none;" preload="metadata"></audio>
</div>

<script>
    // --- KURSOR FIX ---
    const cursor = document.getElementById('custom-cursor');
    const trailsCount = 5;
    const trails = [];
    
    for(let i=0; i<trailsCount; i++){
        let div = document.createElement('div'); div.className = 'cursor-trail';
        document.body.appendChild(div);
        trails.push({ el: div, x: window.innerWidth/2, y: window.innerHeight/2 });
    }

    let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });
    document.addEventListener('mousedown', () => { cursor.style.width = '14px'; cursor.style.height = '14px'; cursor.style.background = 'rgba(0,0,0,0.2)'; });
    document.addEventListener('mouseup', () => { cursor.style.width = '10px'; cursor.style.height = '10px'; cursor.style.background = 'rgba(0,0,0,0.1)'; });

    function animateTrails() {
        let x = mouseX, y = mouseY;
        trails.forEach((trail, index) => {
            const next = trails[index + 1] || trails[0];
            x += (next.x - x) * 0.4; y += (next.y - y) * 0.4;
            trail.x = x; trail.y = y;
            const scale = (trails.length - index) / trails.length;
            trail.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale})`;
        });
        requestAnimationFrame(animateTrails);
    }
    animateTrails();

    // --- TILT PANELI 3D ---
    document.querySelectorAll('.panel').forEach(panel => {
        panel.addEventListener('mousemove', (e) => {
            const rect = panel.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width/2;
            const y = e.clientY - rect.top - rect.height/2;
            const rotX = (-y / rect.height) * 3; const rotY = (x / rect.width) * 3;
            panel.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.01, 1.01, 1.01)`;
            panel.style.boxShadow = `${-rotY*1.5}px ${rotX*1.5}px 20px rgba(0, 0, 0, 0.05)`;
        });
        panel.addEventListener('mouseleave', () => {
            panel.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            panel.style.boxShadow = `0 4px 15px rgba(0, 0, 0, 0.03)`;
        });
    });

    // --- DESZCZ MATRIX ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, columns, drops;
    const chars = "10ABCDEF†‡∆◊☠".split("");
    const fontSize = 16;
    function resizeCanvas() {
        width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight;
        columns = Math.floor(width / fontSize); drops = [];
        for(let x = 0; x < columns; x++) drops[x] = Math.random() * -100;
    }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    function drawMatrix() {
        ctx.fillStyle = 'rgba(253, 253, 253, 0.1)'; ctx.fillRect(0, 0, width, height);
        ctx.font = fontSize + 'px monospace';
        for(let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            const r = Math.random();
            if(r > 0.95) ctx.fillStyle = 'rgba(255, 200, 200, 0.5)'; 
            else if (r > 0.90) ctx.fillStyle = 'rgba(200, 200, 255, 0.5)';
            else ctx.fillStyle = 'rgba(200, 200, 200, 0.3)'; 
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if(drops[i] * fontSize > height && Math.random() > 0.98) drops[i] = 0;
            drops[i] += 0.8;
        }
        requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    // =========================================================
    // --- AUDIO & RADIO LOGIC (NOWY SILNIK GITHUB) ---
    // =========================================================

    const audioPlayer = document.getElementById('audio-player');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const visualizer = document.getElementById('visualizer');
    const seekBar = document.getElementById('seek-bar');
    const volumeBar = document.getElementById('volume-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    
    const trackArtist = document.querySelector('.track-artist');
    const trackName = document.getElementById('track-name');

    // === WAŻNE: ZMIEN TO NA SWÓJ LINK RAW Z GITHUBA ===
    // Musi to być link "raw", a nie zwykły link do repozytorium!
    // Przykład: "https://raw.githubusercontent.com/TwojNick/TwojeRepo/main/audio/"
    const githubBaseUrl = "WSTAW_TUTAJ_SWOJ_LINK_DO_FOLDERU_NA_GUTHUBIE/"; 

    let ramowkaData = [];
    let currentPlaylist = [];
    let currentTrackIndex = 0;
    
    const ambientFile = "https://aelwyd.space/ambient.mp4"; 
    let currentIsAmbient = false;

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // --- Kontrolki odtwarzacza ---
    btnPlay.addEventListener('click', () => {
        if (audioPlayer.paused) { 
            audioPlayer.play().catch(()=>{}); 
        } else { 
            audioPlayer.pause(); 
        }
    });

    audioPlayer.addEventListener('play', () => {
        btnPlay.innerText = "[ PAUSE ]";
        visualizer.classList.add('playing');
    });

    audioPlayer.addEventListener('pause', () => {
        btnPlay.innerText = "[ PLAY ]";
        visualizer.classList.remove('playing');
    });

    volumeBar.addEventListener('input', () => { 
        audioPlayer.volume = volumeBar.value / 100; 
        audioPlayer.muted = (audioPlayer.volume === 0);
    });

    audioPlayer.addEventListener('timeupdate', () => {
        if (audioPlayer.duration) {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            seekBar.value = isNaN(percent) ? 0 : percent;
            timeCurrent.innerText = formatTime(audioPlayer.currentTime);
        }
    });

    audioPlayer.addEventListener('loadedmetadata', () => { 
        timeTotal.innerText = formatTime(audioPlayer.duration); 
    });

    // Przełączanie utworów - działa jako playlista z tablicy
    btnPrev.addEventListener('click', () => {
        if(currentPlaylist.length > 0) {
            currentTrackIndex = (currentTrackIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playCurrentTrack();
            if(btnPlay.innerText === "[ PAUSE ]") audioPlayer.play().catch(()=>{});
        }
    });

    btnNext.addEventListener('click', () => {
        if(currentPlaylist.length > 0) {
            currentTrackIndex = (currentTrackIndex + 1) % currentPlaylist.length;
            playCurrentTrack();
            if(btnPlay.innerText === "[ PAUSE ]") audioPlayer.play().catch(()=>{});
        }
    });

    // --- SILNIK BAZY I RAMÓWKI ---
    function getCycleDay() {
        const now = new Date();
        const localEpochMs = now.getTime() - (now.getTimezoneOffset() * 60000);
        return (Math.floor(localEpochMs / 86400000) % 182) + 1;
    }

    async function loadData() {
        try {
            trackArtist.innerText = "> SYSTEM_INIT";
            trackName.innerText = "Pobieranie ramówki...";
            
            // 1. Pobieranie tylko ramówki z numerami (np. [1, 5, 12, 3])
            const ramRes = await fetch("ramowka.json");
            ramowkaData = await ramRes.json();

            // 2. Wybór playlisty na dany dzień
            const cycleDay = getCycleDay();
            const dayIndex = (cycleDay - 1) % ramowkaData.length;
            currentPlaylist = ramowkaData[dayIndex];

            if (!currentPlaylist || currentPlaylist.length === 0) {
                return playAmbient();
            }

            // 3. Start od indeksu 0
            currentTrackIndex = 0;
            playCurrentTrack();

        } catch (error) {
            console.error("Błąd ładowania danych: ", error);
            trackArtist.innerText = "> FATAL_ERROR";
            trackName.innerText = "Brak połączenia 💀";
        }
    }

    function playCurrentTrack() {
        if (currentPlaylist.length === 0) return playAmbient();

        // Pobiera kolejny numer z tablicy (np. 12)
        const trackId = currentPlaylist[currentTrackIndex];
        
        // Tworzy url, np: https://raw.githubusercontent.com/.../12.mp3
        const trackUrl = `${githubBaseUrl}${trackId}.mp3`;

        audioPlayer.src = trackUrl;
        currentIsAmbient = false;
        audioPlayer.loop = false;
        audioPlayer.load();

        audioPlayer.onended = () => {
            // Przejdź do kolejnego numeru w ramówce
            currentTrackIndex++;
            
            // Zapętl playlistę na dany dzień, jeśli doszliśmy do końca
            if (currentTrackIndex >= currentPlaylist.length) {
                currentTrackIndex = 0; 
            }
            playCurrentTrack();
            audioPlayer.play().catch(() => {});
        };

        trackArtist.innerText = "> NADAWANIE";
        trackName.innerText = `Plik: ${trackId}.mp3`;
    }

    function playAmbient() {
        if (audioPlayer.dataset.currentId !== "ambient") {
            audioPlayer.src = ambientFile;
            audioPlayer.dataset.currentId = "ambient";
            currentIsAmbient = true;
            audioPlayer.loop = true;
            audioPlayer.load();
            audioPlayer.play().catch(() => {});
        }
        trackArtist.innerText = "> SYSTEM_OVERRIDE";
        trackName.innerText = "PRZERWA_TECHNICZNA";
    }

    // Uruchom ładowanie na start
    loadData();
</script>
</body>
</html>
